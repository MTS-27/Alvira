<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 17th Birthday, Alvira!</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet" />

    <style>
        /* -------------------------------------------------
       Global Styles & Theme
    ------------------------------------------------- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ffedf5, #f3e8ff, #e0f7ff);
            --primary-pink: #ff9ac2;
            --lavender: #c8b6ff;
            --rose-gold: #b76e79;
            --cream: #fff9e6;
            --glass-bg: rgba(255, 255, 255, .25);
            --glass-border: rgba(255, 255, 255, .3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            overflow-x: hidden;
            min-height: 100vh;
            color: #444;
        }

        /* -------------------------------------------------
       Background – floating balloons & stars
    ------------------------------------------------- */
        .bg-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-decor::before,
        .bg-decor::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, var(--primary-pink), transparent);
            border-radius: 50%;
            animation: float 12s ease-in-out infinite;
        }

        .bg-decor::after {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 40% 40%, var(--lavender), transparent);
            top: 70%;
            left: 80%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }

            50% {
                transform: translateY(-30px) rotate(45deg);
                opacity: 1;
            }

            100% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }
        }

        /* -------------------------------------------------
       Hero Section
    ------------------------------------------------- */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--rose-gold);
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            animation: fadeIn 2s ease-out, float 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* -------------------------------------------------
       Cake + Candles
    ------------------------------------------------- */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0;
        }

        .cake {
            position: relative;
            width: 180px;
            height: 180px;
            background: var(--cream);
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            box-shadow: inset 0 -10px 12px rgba(0, 0, 0, .1);
            cursor: pointer;
            animation: cakeShake 0.3s
        }

        .cake:hover {
            animation-play-state: running;
        }

        @keyframes cakeShake {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        .candle {
            position: absolute;
            width: 8px;
            height: 20px;
            background: var(--primary-pink);
            border-radius: 2px;
            bottom: 100%;
            transform-origin: bottom center;
        }

        .candle::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid var(--primary-pink);
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 8px;
            height: 12px;
            background: radial-gradient(circle, #fffb96, #ff9c45);
            border-radius: 50% 50% 0 0;
            opacity: 1;
            transform: translateX(-50%);
            animation: flicker 0.6s infinite;
        }

        @keyframes flicker {

            0%,
            100% {
                transform: translateX(-50%) scaleY(1);
            }

            50% {
                transform: translateX(-50%) scaleY(0.8);
            }
        }

        .blown .flame {
            opacity: 0;
            animation: none;
        }

        /* -------------------------------------------------
       Message Card (Glassmorphism)
    ------------------------------------------------- */
        .message-card {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            max-width: 500px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
            animation: fadeIn 1.5s ease;
        }

        .card p {
            margin: 1rem 0;
            line-height: 1.5;
        }

        .card .sign {
            margin-top: 2rem;
            font-weight: 600;
            color: var(--rose-gold);
        }

        /* -------------------------------------------------
       Photo Memory Lane (Polaroid Grid)
    ------------------------------------------------- */
        .gallery-section {
            padding: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            justify-items: center;
        }

        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 8px solid #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
            transform: rotate(-2deg);
            transition: transform .3s, box-shadow .3s;
        }

        .gallery img:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .3);
        }

        /* -------------------------------------------------
       Responsive tweaks
    ------------------------------------------------- */
        @media(max-width:600px) {
            .cake {
                width: 140px;
                height: 140px;
            }

            .card {
                padding: 1.5rem;
            }
        }

        /* ---------- Pandas ---------- */
                /* ---------- Love Hearts ---------- */
        .heart-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            margin: 2rem 0;
        }
        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path d="M23.6 0c-3.4 0-6.4 1.7-8.1 4.4C13.8 1.7 10.8 0 7.4 0 3.3 0 0 3.4 0 7.6c0 9.4 16 21.4 16 21.4s16-12 16-21.4C32 3.4 28.7 0 24.6 0z" fill="%23ff69b4"/></svg>') center/contain no-repeat;
            animation: floatHeart 5s linear infinite;
        }
        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Background decor -->
    <div class="bg-decor"></div>

    <!-- Hero -->
    <section class="hero">
        <h1>Happy 17th Birthday, Alvira!</h1>
    </section>

    <!-- Cake -->
    <section class="cake-section">
        <div class="cake" id="cake">
            <!-- 17 candles generated via JS -->
        </div>
        <p style="margin-top:0.5rem;font-family:'Poppins',sans-serif;">Tap the cake to blow out the candles!</p>
    </section>

    <!-- Message Card -->
    <section class="message-card">
        <div class="card">
            <p>Wishing you the happiest 17th birthday, Alvira! May this year be filled with unforgettable memories,
                endless happiness and all the success in the world. Enjoy your special day to the fullest!</p>
            <p class="sign">With love, Taha</p>
        </div>
    </section>

    <!-- Pandas -->
    <section class="panda-section">
        <div class="panda"></div>
        <div class="panda"></div>
        <div class="panda"></div>
        <div class="panda"></div>
    </section>

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        /* -------------------------------------------------
           Helper: create 17 candles around the cake
        ------------------------------------------------- */
        const cake = document.getElementById('cake');
        const candleCount = 17;
        const radius = 80; // distance from cake centre

        for (let i = 0; i < candleCount; i++) {
            const angle = (i / candleCount) * Math.PI * 2;
            const x = radius * Math.cos(angle) + cake.offsetWidth / 2 - 4; // 4 = half candle width
            const y = radius * Math.sin(angle) + cake.offsetHeight / 2 - 20;
            const candle = document.createElement('div');
            candle.className = 'candle';
            candle.style.position = 'absolute';
            candle.style.left = `${x}px`;
            candle.style.top = `${y}px`;
            candle.innerHTML = '<div class="flame"></div>';
            cake.appendChild(candle);
        }

        /* -------------------------------------------------
           Cake click: blow out candles + confetti
        ------------------------------------------------- */
        let candlesBlown = false;
        cake.addEventListener('click', () => {
            // Blow out candles only the first time
            if (!candlesBlown) {
                candlesBlown = true;
                document.querySelectorAll('.flame').forEach(f => f.parentElement.classList.add('blown'));
            }

            // One‑burst confetti
            const duration = 2000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            const randomInRange = (min, max) => Math.random() * (max - min) + min;
            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    return;
                }
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.3, 0.7), y: 0.6 }
                }));
            }, 250);
        });


        /* -------------------------------------------------
           Optional: pause music when page hidden (saves annoyance)
        ------------------------------------------------- */




    </script>
</body>

</html>
