<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 17th Birthday, Alvira!</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet" />

    <style>
        /* -------------------------------------------------
       Global Styles & Theme
    ------------------------------------------------- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ffedf5, #f3e8ff, #e0f7ff);
            --primary-pink: #ff9ac2;
            --lavender: #c8b6ff;
            --rose-gold: #b76e79;
            --cream: #fff9e6;
            --glass-bg: rgba(255, 255, 255, .25);
            --glass-border: rgba(255, 255, 255, .3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            overflow-x: hidden;
            min-height: 100vh;
            color: #444;
        }

        /* -------------------------------------------------
       Background – floating balloons & stars
    ------------------------------------------------- */
        .bg-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-decor::before,
        .bg-decor::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, var(--primary-pink), transparent);
            border-radius: 50%;
            animation: float 12s ease-in-out infinite;
        }

        .bg-decor::after {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 40% 40%, var(--lavender), transparent);
            top: 70%;
            left: 80%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }

            50% {
                transform: translateY(-30px) rotate(45deg);
                opacity: 1;
            }

            100% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }
        }

        /* -------------------------------------------------
       Hero Section
    ------------------------------------------------- */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--rose-gold);
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            animation: fadeIn 2s ease-out, float 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* -------------------------------------------------
       Cake + Candles
    ------------------------------------------------- */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0;
        }

        .cake {
            position: relative;
            width: 180px;
            height: 180px;
            background: var(--cream);
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            box-shadow: inset 0 -10px 12px rgba(0, 0, 0, .1);
            cursor: pointer;
            animation: cakeShake 0.3s
        }

        .cake:hover {
            animation-play-state: running;
        }

        @keyframes cakeShake {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        .candle {
            position: absolute;
            width: 8px;
            height: 20px;
            background: var(--primary-pink);
            border-radius: 2px;
            bottom: 100%;
            transform-origin: bottom center;
            margin-left: -4px;  /* half of 8px width  */
            margin-top: -10px;  /* half of 20px height */
        }

        .candle::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid var(--primary-pink);
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 8px;
            height: 12px;
            background: radial-gradient(circle, #fffb96, #ff9c45);
            border-radius: 50% 50% 0 0;
            opacity: 1;
            transform: translateX(-50%);
            animation: flicker 0.6s infinite;
        }

        @keyframes flicker {

            0%,
            100% {
                transform: translateX(-50%) scaleY(1);
            }

            50% {
                transform: translateX(-50%) scaleY(0.8);
            }
        }

        .blown .flame {
            opacity: 0;
            animation: none;
        }

        /* -------------------------------------------------
       Message Card (Glassmorphism)
    ------------------------------------------------- */
        .message-card {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            max-width: 500px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
            animation: fadeIn 1.5s ease;
        }

        .card p {
            margin: 1rem 0;
            line-height: 1.5;
        }

        .card .sign {
            margin-top: 2rem;
            font-weight: 600;
            color: var(--rose-gold);
        }

        /* -------------------------------------------------
       Photo Memory Lane (Polaroid Grid)
    ------------------------------------------------- */
        .gallery-section {
            padding: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            justify-items: center;
        }

        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 8px solid #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
            transform: rotate(-2deg);
            transition: transform .3s, box-shadow .3s;
        }

        .gallery img:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .3);
        }

        /* ---------- Pink Front Card ---------- */
        .card {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            background: #ffb6c1;
            /* light pink */
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            cursor: pointer;
        }

        .card .front {
            padding: 2rem;
            text-align: center;
            color: #fff;
            position: relative;
        }

        .card .front h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 2.5rem;
        }

        .card .front .heart-icon {
            width: 80px;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path d="M23.6 0c-3.4 0-6.4 1.7-8.1 4.4C13.8 1.7 10.8 0 7.4 0 3.3 0 0 3.4 0 7.6c0 9.4 16 21.4 16 21.4s16-12 16-21.4C32 3.4 28.7 0 24.6 0z" fill="%23fff"/></svg>') center/contain no-repeat;
            margin: 1rem auto 0;
        }

        .card .content {
            display: none;
            flex-direction: row;
            gap: 1rem;
            padding: 1.5rem;
        }

        .card.open .content {
            display: flex;
        }

        .card .left,
        .card .right {
            flex: 1;
        }

        .card .right p {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            line-height: 1.5;
        }

        .card .sign {
            margin-top: 0.5rem;
            font-weight: bold;
        }

        .heart-section {
            margin-top: 2rem;
        }

        .heart-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path d="M23.6 0c-3.4 0-6.4 1.7-8.1 4.4C13.8 1.7 10.8 0 7.4 0 3.3 0 0 3.4 0 7.6c0 9.4 16 21.4 16 21.4s16-12 16-21.4C32 3.4 28.7 0 24.6 0z" fill="%23ff69b4"/></svg>') center/contain no-repeat;
            animation: floatHeart 5s linear infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }

        /* -------------------------------------------------
       Responsive tweaks
    ------------------------------------------------- */
        @media(max-width:600px) {
            .cake {
                width: 140px;
                height: 140px;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background decor -->
    <div class="bg-decor"></div>

    <!-- Hero -->
    <section class="hero">
        <h1>Happy 17th Birthday, Alvira!</h1>
    </section>

    <!-- Pink Front Card -->
    <section class="card" id="birthdayCard">
        <div class="front">
            <h1>Happy Birthday</h1>
            <div class="heart-icon"></div>
        </div>
        <div class="content">
            <div class="left">
                <section class="cake-section">
                    <div class="cake" id="cake">
                        <!-- 17 candles positioned around the cake -->
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(0deg) translate(90px) rotate(-0deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(21.176deg) translate(90px) rotate(-21.176deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(42.352deg) translate(90px) rotate(-42.352deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(63.528deg) translate(90px) rotate(-63.528deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(84.704deg) translate(90px) rotate(-84.704deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(105.88deg) translate(90px) rotate(-105.88deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(127.056deg) translate(90px) rotate(-127.056deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(148.232deg) translate(90px) rotate(-148.232deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(169.408deg) translate(90px) rotate(-169.408deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(190.584deg) translate(90px) rotate(-190.584deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(211.76deg) translate(90px) rotate(-211.76deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(232.936deg) translate(90px) rotate(-232.936deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(254.112deg) translate(90px) rotate(-254.112deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(275.288deg) translate(90px) rotate(-275.288deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(296.464deg) translate(90px) rotate(-296.464deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(317.64deg) translate(90px) rotate(-317.64deg);">
                            <div class="flame"></div>
                        </div>
                        <div class="candle"
                            style="position:absolute; top:50%; left:50%; transform:rotate(338.816deg) translate(90px) rotate(-338.816deg);">
                            <div class="flame"></div>
                        </div>
                    </div>
                    <p style="margin-top:0.5rem;font-family:'Poppins',sans-serif;">Tap the cake to blow out the candles!
                    </p>
                </section>
            </div>
            <div class="right">
                <p>Wishing you the happiest 17th birthday, Alvira! May this year be filled with unforgettable memories,
                    endless happiness and all the success in the world. Enjoy your special day to the fullest!</p>
                <p class="sign">With love, Taha</p>
            </div>
        </div>
    </section>

    <!-- Hearts -->
    <section class="heart-section">
        <div class="heart-container" id="heartContainer"></div>
    </section>



    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>

        // Card click to open (toggle front/back view)
        const card = document.getElementById('birthdayCard');
        const front = card.querySelector('.front');
        front.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.add('open');
        });
        // generate hearts
        const heartContainer = document.getElementById('heartContainer');
        for (let i = 0; i < 30; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '-30px';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartContainer.appendChild(heart);
        }



        /* -------------------------------------------------
           Cake click: blow out candles + confetti
        ------------------------------------------------- */
        const cake = document.getElementById('cake');
        let candlesBlown = false;
        cake.addEventListener('click', () => {
            // Blow out candles only the first time
            if (!candlesBlown) {
                candlesBlown = true;
                document.querySelectorAll('.flame').forEach(f => f.parentElement.classList.add('blown'));
            }

            // One‑burst confetti
            const duration = 2000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            const randomInRange = (min, max) => Math.random() * (max - min) + min;
            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    return;
                }
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.3, 0.7), y: 0.6 }
                }));
            }, 250);
        });


        /* -------------------------------------------------
           Optional: pause music when page hidden (saves annoyance)
        ------------------------------------------------- */




    </script>
</body>

</html>
