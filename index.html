<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 17th Birthday, Alvira!</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet" />

    <style>
        /* -------------------------------------------------
       Global Styles & Theme
    ------------------------------------------------- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ffedf5, #f3e8ff, #e0f7ff);
            --primary-pink: #ff9ac2;
            --lavender: #c8b6ff;
            --rose-gold: #b76e79;
            --cream: #fff9e6;
            --glass-bg: rgba(255, 255, 255, .25);
            --glass-border: rgba(255, 255, 255, .3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            overflow-x: hidden;
            min-height: 100vh;
            color: #444;
        }

        /* -------------------------------------------------
       Background – floating balloons & stars
    ------------------------------------------------- */
        .bg-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-decor::before,
        .bg-decor::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, var(--primary-pink), transparent);
            border-radius: 50%;
            animation: float 12s ease-in-out infinite;
        }

        .bg-decor::after {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 40% 40%, var(--lavender), transparent);
            top: 70%;
            left: 80%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }

            50% {
                transform: translateY(-30px) rotate(45deg);
                opacity: 1;
            }

            100% {
                transform: translateY(0) rotate(0deg);
                opacity: .7;
            }
        }

        /* -------------------------------------------------
       Hero Section
    ------------------------------------------------- */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--rose-gold);
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            animation: floatY 3s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes floatY {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* -------------------------------------------------
       Cake + Candles
    ------------------------------------------------- */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0;
        }

        .cake {
            position: relative;
            width: 180px;
            height: 180px;
            background: var(--cream);
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            box-shadow: inset 0 -10px 12px rgba(0, 0, 0, .1);
            cursor: pointer;
            animation: cakeShake 0.3s ease-in-out infinite paused;
        }

        .cake:hover {
            animation-play-state: running;
        }

        @keyframes cakeShake {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        .candle {
            position: absolute;
            width: 8px;
            height: 20px;
            background: var(--primary-pink);
            border-radius: 2px;
            bottom: 100%;
            transform-origin: bottom center;
        }

        .candle::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid var(--primary-pink);
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 8px;
            height: 12px;
            background: radial-gradient(circle, #fffb96, #ff9c45);
            border-radius: 50% 50% 0 0;
            opacity: 1;
            transform: translateX(-50%);
            animation: flicker 0.6s infinite;
        }

        @keyframes flicker {

            0%,
            100% {
                transform: translateX(-50%) scaleY(1);
            }

            50% {
                transform: translateX(-50%) scaleY(0.8);
            }
        }

        .blown .flame {
            opacity: 0;
            animation: none;
        }

        /* -------------------------------------------------
       Message Card (Glassmorphism)
    ------------------------------------------------- */
        .message-card {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            max-width: 500px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
            animation: fadeIn 1.5s ease;
        }

        .card p {
            margin: 1rem 0;
            line-height: 1.5;
        }

        .card .sign {
            margin-top: 2rem;
            font-weight: 600;
            color: var(--rose-gold);
        }

        /* -------------------------------------------------
       Photo Memory Lane (Polaroid Grid)
    ------------------------------------------------- */
        .gallery-section {
            padding: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            justify-items: center;
        }

        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 8px solid #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
            transform: rotate(-2deg);
            transition: transform .3s, box-shadow .3s;
        }

        .gallery img:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .3);
        }

        /* -------------------------------------------------
       Music Toggle
    ------------------------------------------------- */
        .music-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 10;
        }

        .music-toggle button {
            background: var(--primary-pink);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .3s;
        }

        .music-toggle button:hover {
            background: #ff7aa1;
        }

        /* -------------------------------------------------
       Responsive tweaks
    ------------------------------------------------- */
        @media(max-width:600px) {
            .cake {
                width: 140px;
                height: 140px;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background decor -->
    <div class="bg-decor"></div>

    <!-- Hero -->
    <section class="hero">
        <h1>Happy 17th Birthday, Alvira!</h1>
    </section>

    <!-- Cake -->
    <section class="cake-section">
        <div class="cake" id="cake">
            <!-- 17 candles generated via JS -->
        </div>
        <p style="margin-top:0.5rem;font-family:'Poppins',sans-serif;">Tap the cake to blow out the candles!</p>
    </section>

    <!-- Message Card -->
    <section class="message-card">
        <div class="card">
            <p>Wishing you the happiest 17th birthday, Alvira! May this year be filled with unforgettable memories,
                endless happiness and all the success in the world. Enjoy your special day to the fullest!</p>
            <p class="sign">With love, Taha</p>
        </div>
    </section>

    <!-- Music (autoplay) -->
    <!-- Music (autoplay muted) -->
<audio id="bgMusic" src="birthday.mp3" autoplay loop muted></audio>

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        /* -------------------------------------------------
           Helper: create 17 candles around the cake
        ------------------------------------------------- */
        const cake = document.getElementById('cake');
        const candleCount = 17;
        const radius = 80; // distance from cake centre
        // Reference to the audio element (muted for autoplay)
        const music = document.getElementById('bgMusic');
        for (let i = 0; i < candleCount; i++) {
            const angle = (i / candleCount) * Math.PI * 2;
            const x = radius * Math.cos(angle) + cake.offsetWidth / 2 - 4; // 4 = half candle width
            const y = radius * Math.sin(angle) + cake.offsetHeight / 2 - 20; // 20 = candle height
            const candle = document.createElement('div');
            candle.className = 'candle';
            candle.style.left = `${x}px`;
            candle.style.top = `${y}px`;
            candle.innerHTML = '<div class="flame"></div>';
            cake.appendChild(candle);
        }

        /* -------------------------------------------------
           Cake click: blow out candles + confetti
        ------------------------------------------------- */
        let candlesBlown = false;
        cake.addEventListener('click', () => {
            if (candlesBlown) return;
            candlesBlown = true;
            // fade out flames
            document.querySelectorAll('.flame').forEach(f => f.parentElement.classList.add('blown'));

            // Unmute and start the music now that the user interacted
            music.muted = false;
            music.play().catch(() => {});

            // confetti burst – 5 bursts for a dramatic effect
            const duration = 2 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }
            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                const particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than the cake
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.3, 0.7), y: 0.6 }
                }));
            }, 250);
        });

        /* -------------------------------------------------
           Optional: pause music when page hidden (saves annoyance)
        ------------------------------------------------- */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                music.pause();
            }
        });

        /* -------------------------------------------------
           Optional: pause music when page hidden (saves annoyance)
        ------------------------------------------------- */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && playing) {
                music.pause();
                musicBtn.textContent = '▶';
                playing = false;
            }
        });
    </script>
</body>

</html>
